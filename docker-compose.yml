services:
  db:
    image: postgres:16-alpine
    container_name: paypilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: paypilot
      POSTGRES_PASSWORD: paypilot
      POSTGRES_DB: paypilot
    ports:
      - "5432:5432"
    volumes:
      - paypilot-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paypilot -d paypilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  paypilot-db-data:
